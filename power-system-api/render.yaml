services:
  - type: web
    name: powerflow-api
    runtime: python
    plan: free   # 명시하지 않으면 Render Blueprint가 유료 starter 플랜으로 만든다
    rootDir: power-system-api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false   # Render 대시보드에서 직접 입력 (보안)
